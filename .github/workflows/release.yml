# Builds Sunbeam.exe and the setup on GitHub's Windows machines. A tag that
# starts with v (v1.0.0) publishes both as a release; started by hand, the
# workflow only keeps them as an artifact of the run.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build Sunbeam.exe
        shell: cmd
        run: build.bat

      - name: Build the setup
        shell: pwsh
        run: |
          $iscc = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe'
          if (-not (Test-Path $iscc)) { choco install innosetup --no-progress -y }
          & $iscc /Q installer\Sunbeam.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Keep the files
        uses: actions/upload-artifact@v4
        with:
          name: sunbeam
          path: |
            out/Sunbeam.exe
            out/SunbeamSetup.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" out\SunbeamSetup.exe out\Sunbeam.exe --title "Sunbeam ${{ github.ref_name }}" --notes-file installer\release-notes.md
